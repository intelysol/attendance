name: intelysol_hcm_mobile
description: "Intelysol HCM Mobile — Production Native Flutter App for Laravel HCM SaaS"
publish_to: 'none'
version: 1.4.0+14

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4

  # Networking & Serialization
  dio: ^5.4.1
  json_annotation: ^4.8.1

  # Security & Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

  # Geolocation & Geofencing
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # UI & Design System
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
